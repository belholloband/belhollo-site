<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ターミナル | ベルホーロ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #666;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        @media(max-width: 768px) {
            header {
                padding: 20px 24px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 0;
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            }
            .hamburger {
                display: flex !important;
            }

            header.scrolled {
                padding: 16px 24px;
            }

            nav {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: flex-end;
                gap: 20px;
                margin-top: 20px;
            }
            nav.open {
                display: flex;
            }
            nav a {
                margin-left: 0;
            }
        }

        /* --- Album Page Layout --- */
        .album-page {
            display: flex;
            gap: 120px;
            padding: 220px 12%;
            max-width: 1200px;
            margin: auto;
        }

        .album-left {
            width: 40%;
        }

        .album-left h1 {
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 40px;
            color: #333;
        }

        .album-cover {
            width: 100%;
            max-width: 420px;
            display: block;
        }

        .album-right {
            width: 60%;
        }

        .album-info {
            margin-bottom: 60px;
            color: #555;
        }

        .track-section {
            margin-bottom: 60px;
        }

        .track-section h2 {
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 10px;
            color: #333;
        }

        .tracklist {
            list-style: none;
            padding: 0;
        }

        .tracklist li {
            margin-bottom: 12px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
        }

        .mv-icon {
            font-size: 12px;
            text-decoration: none;
            color: #555;
            transition: 0.3s;
        }

        .mv-icon:hover {
            color: #111;
        }

        .album-link h2 {
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 10px;
            color: #333;
        }

        .album-link a {
            color: #555;
            text-decoration: none;
        }

        .album-link a:hover {
            color: #111;
        }

        /* --- モーダル --- */
        .lyrics-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s ease;
            z-index: 1000;
        }

        .lyrics-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lyrics-content {
            background: #f0f4f8;
            padding: 60px;
            max-width: 600px;
            width: 80%;
            color: #333;
            line-height: 2;
            border-radius: 8px;
            max-height: 70vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: 0.4s;
        }

        .lyrics-modal.active .lyrics-content {
            transform: translateY(0);
        }

        .lyrics-content h3 {
            margin-bottom: 30px;
            letter-spacing: 4px;
        }

        .lyrics-content p {
            white-space: pre-line;
            color: #555;
        }

        .tracklist li {
            cursor: pointer;
            transition: 0.3s;
        }

        .tracklist li:hover {
            color: #111;
        }

        @media(max-width: 768px) {
            .album-page {
                flex-direction: column;
                gap: 60px;
                padding: 160px 10%;
            }

            .album-left,
            .album-right {
                width: 100%;
            }

            .album-cover {
                max-width: 100%;
            }
        }
    
        .sub-header {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 60px;
            display: flex;
            justify-content: flex-end;
            gap: 40px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(-10px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 99;
        }
        .sub-header.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .sub-header a {
            color: #444;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 4px;
            transition: color 0.3s ease;
            margin-left: 0;
        }
        .sub-header a:hover {
            color: #111;
        }
        @media(max-width: 768px) {
            .sub-header {
                flex-wrap: wrap;
                gap: 16px;
                padding: 16px;
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }
        }
            .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            cursor: pointer;
            z-index: 101;
        }
        .hamburger span {
            display: block;
            height: 1px;
            width: 100%;
            background-color: #444;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: translateY(8.5px) rotate(45deg);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: translateY(-8.5px) rotate(-45deg);
        }
    </style>
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <header id="header">
        <div><a href="index.html" style="display: flex; align-items: center; text-decoration: none;"><img src="logo.png" alt="Belhollo" style="height: 28px; width: auto;"></a></div>
        <div class="hamburger" id="hamburger">

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>

    <!-- モーダル本体 -->
    <div id="lyrics-modal" class="lyrics-modal">
        <div class="lyrics-content">
            <h3 id="lyrics-title"></h3>
            <p id="lyrics-text"></p>
        </div>
    </div>

    <script>
        const lyricsData = {
            "ターミナル": `どうせならいっそ
駆けていく方が
悪目立ちして
気づかれるかな

振り返ると
この世は夢幻
華のように
終わらぬ流転

どうせならいっそ
欠けていく方が
悪目立ちして
気づかれるかな

振り返ると
この世は無間
華のように
終わらぬ流転`
        };

        function openLyrics(title) {
            document.getElementById("lyrics-title").innerText = title;
            document.getElementById("lyrics-text").innerText = lyricsData[title];
            document.getElementById("lyrics-modal").classList.add("active");
        }

        document.getElementById("lyrics-modal").addEventListener("click", function () {
            this.classList.remove("active");
        });
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hamburger = document.getElementById("hamburger");
            const navMenu = document.getElementById("nav-menu");

            if (hamburger && navMenu) {
                hamburger.addEventListener("click", function() {
                    hamburger.classList.toggle("active");
                    navMenu.classList.toggle("open");
                    if (!hamburger.classList.contains("active") && subHeader) {
                        subHeader.classList.remove("visible");
                    }
                });
            }

            const linkTrigger = document.getElementById("link-trigger");
            const subHeader = document.getElementById("sub-header");
            let hideTimeout;

            if (linkTrigger && subHeader) {
                linkTrigger.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                        subHeader.classList.add("visible");
                    }
                });
                
                subHeader.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                    }
                });

                linkTrigger.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });
                
                subHeader.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });

                linkTrigger.addEventListener("click", function(e) {
                    e.preventDefault();
                    if(window.innerWidth <= 768) {
                        subHeader.classList.toggle("visible");
                    }
                });
            }
        });
    </script>
</body>
