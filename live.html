<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | ベルホーロ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #666;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        @media(max-width: 768px) {
            header {
                padding: 20px 24px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 0;
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            }
            .hamburger {
                display: flex !important;
            }

            header.scrolled {
                padding: 16px 24px;
            }

            nav {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: flex-end;
                gap: 20px;
                margin-top: 20px;
            }
            nav.open {
                display: flex;
            }
            nav a {
                margin-left: 0;
            }
        }

        /* --- Live Layout --- */
        .live-container {
            padding: 220px 12%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .live-section {
            margin-bottom: 160px;
        }

        .live-section h2 {
            font-size: 12px;
            letter-spacing: 6px;
            margin-bottom: 80px;
            color: #555;
        }

        .live-item {
            margin-bottom: 80px;
            padding-bottom: 40px;
            border-bottom: 1px solid #222;
        }

        .live-date {
            font-size: 12px;
            letter-spacing: 3px;
            color: #555;
            margin-bottom: 10px;
        }

        .live-title {
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            color: #333;
        }

        .live-venue {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }

        .live-detail {
            font-size: 13px;
            color: #444;
            line-height: 1.8;
        }

        .year {
            font-size: 12px;
            letter-spacing: 5px;
            color: #444;
            margin: 60px 0 40px;
        }

        .coming-soon {
            font-size: 12px;
            letter-spacing: 6px;
            color: #444;
            text-align: center;
            margin: 40px 0;
            padding: 40px;
            border: 1px solid #111;
        }

        @media(max-width:768px) {
            .live-container {
                padding: 160px 8%;
            }

            .live-section {
                margin-bottom: 100px;
            }

            .live-item {
                margin-bottom: 60px;
            }
        }
            .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            cursor: pointer;
            z-index: 101;
        }
        .hamburger span {
            display: block;
            height: 1px;
            width: 100%;
            background-color: #444;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: translateY(8.5px) rotate(45deg);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: translateY(-8.5px) rotate(-45deg);
        }
            .archive-link {
            text-align: center;
            margin-top: 100px;
            margin-bottom: 60px;
        }
        .archive-button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            border: 1px solid #111;
            color: #111;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 14px;
            transition: 0.3s;
        }
        .archive-button:hover {
            background: #111;
            color: #fff;
        }
    </style>

    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <header id="header">
        <div><a href="index.html" style="display: flex; align-items: center; text-decoration: none;"><img src="logo.png" alt="Belhollo" style="height: 28px; width: auto;"></a></div>
        <div class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </div>
        <nav id="nav-menu">
            <a href="profile.html">PROFILE</a>
            <a href="news.html">NEWS</a>
            <a href="live.html">LIVE</a>
            <a href="lyrics.html">LYRICS</a>
            <a href="link.html">LINK</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>


    <section class="live-container">

        <div class="live-section">
            <h2>UPCOMING</h2>

            <div class="live-item" style="border-bottom: none; text-align: center; padding: 60px 0;">
                <p style="letter-spacing: 4px; color: #555;">coming soon...</p>
            </div>


            
        </div>

        <section class="archive-link">
            <h2>ARCHIVE</h2>
            <a href="archive.html" class="archive-button">
                VIEW ARCHIVE →
            </a>
        </section>
        </div>

    </section>

    <footer>
        &copy; 2026 Belhollo
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hamburger = document.getElementById("hamburger");
            const navMenu = document.getElementById("nav-menu");

            if (hamburger && navMenu) {
                hamburger.addEventListener("click", function() {
                    hamburger.classList.toggle("active");
                    navMenu.classList.toggle("open");

                });
            }
            }
        });
    </script>
</body>


</html>
