    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #666;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        @media(max-width: 768px) {
            header {
                padding: 24px 24px;
                flex-direction: column;
                gap: 16px;
            }

            header.scrolled {
                padding: 16px 24px;
            }

            nav {
                display: flex;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 16px;
            }
            nav a {
                margin-left: 0;
            }
        }

        /* --- Lyrics Layout --- */
        .lyrics-grid {
            padding: 200px 10%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 80px 60px;
        }

        .lyrics-item {
            text-align: center;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lyrics-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            filter: brightness(0.9);
            transition: all 0.6s ease;
            background: #111;
            /* fallback for missing images */
        }

        .lyrics-item:hover {
            transform: translateY(-12px);
        }

        .lyrics-item:hover img {
            filter: brightness(1);
        }

        .lyrics-title {
            margin-top: 30px;
            font-size: 12px;
            letter-spacing: 6px;
            color: #444;
        }

        @media(max-width: 768px) {
            .lyrics-grid {
                grid-template-columns: 1fr;
                gap: 80px;
                padding: 160px 8%;
            }
        }
    
        .sub-header {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 60px;
            display: flex;
            justify-content: flex-end;
            gap: 40px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(-10px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 99;
        }
        .sub-header.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .sub-header a {
            color: #444;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 4px;
            transition: color 0.3s ease;
            margin-left: 0;
        }
        .sub-header a:hover {
            color: #111;
        }
        @media(max-width: 768px) {
            .sub-header {
                flex-wrap: wrap;
                gap: 16px;
                padding: 16px;
            }
        }
    </style>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const linkTrigger = document.getElementById("link-trigger");
            const subHeader = document.getElementById("sub-header");
            let hideTimeout;

            if (linkTrigger && subHeader) {
                linkTrigger.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                        subHeader.classList.add("visible");
                    }
                });
                
                subHeader.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                    }
                });

                linkTrigger.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });
                
                subHeader.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });

                linkTrigger.addEventListener("click", function(e) {
                    e.preventDefault();
                    if(window.innerWidth <= 768) {
                        subHeader.classList.toggle("visible");
                    }
                });
            }
        });
    </script>
