<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT | ベルホーロ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #666;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        @media(max-width: 768px) {
            header {
                padding: 20px 24px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 0;
            }
            .hamburger {
                display: flex !important;
            }

            header.scrolled {
                padding: 16px 24px;
            }

            nav {
                display: none;
                width: 100%;
                flex-direction: column;
                align-items: flex-end;
                gap: 20px;
                margin-top: 20px;
            }
            nav.open {
                display: flex;
            }
            nav a {
                margin-left: 0;
            }
        }

        /* --- Contact Layout --- */
        .contact-container {
            padding: 220px 12%;
            max-width: 700px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-container h1 {
            font-size: 14px;
            letter-spacing: 8px;
            margin-bottom: 120px;
            color: #333;
            text-align: center;
        }

        .contact-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 80px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            color: #444;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #aaa;
            padding: 10px 0;
            color: #333;
            font-size: 14px;
            outline: none;
            transition: 0.4s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-bottom: 1px solid #fff;
        }

        textarea {
            resize: none;
        }

        button {
            margin-top: 40px;
            padding: 14px 40px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            font-size: 12px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.4s ease;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        @media(max-width:768px) {
            .contact-container {
                padding: 160px 8%;
            }

            .form-group {
                margin-bottom: 60px;
            }
        }
    
        .sub-header {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 60px;
            display: flex;
            justify-content: flex-end;
            gap: 40px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(-10px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 99;
        }
        .sub-header.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .sub-header a {
            color: #444;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 4px;
            transition: color 0.3s ease;
            margin-left: 0;
        }
        .sub-header a:hover {
            color: #111;
        }
        @media(max-width: 768px) {
            .sub-header {
                flex-wrap: wrap;
                gap: 16px;
                padding: 16px;
            }
        }
            .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            cursor: pointer;
            z-index: 101;
        }
        .hamburger span {
            display: block;
            height: 1px;
            width: 100%;
            background-color: #444;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: translateY(8.5px) rotate(45deg);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: translateY(-8.5px) rotate(-45deg);
        }
    </style>
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <header id="header">
        <div><a href="index.html" style="display: flex; align-items: center; text-decoration: none;"><img src="logo.png" alt="Belhollo" style="height: 28px; width: auto;"></a></div>
        <div class="hamburger" id="hamburger">
            <span></span><span></span><span></span>

        <nav id="nav-menu">

            <div class="sub-header" id="sub-header">

    <section class="contact-container">

        <h1>CONTACT</h1>

        <form class="contact-form" action="https://formspree.io/f/mkoqzelj" method="POST">

            <input type="text" name="_gotcha" style="display:none">

            <input type="hidden" name="_next" value="thanks.html">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>

    <footer>
        &copy; 2026 Belhollo
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hamburger = document.getElementById("hamburger");
            const navMenu = document.getElementById("nav-menu");

            if (hamburger && navMenu) {
                hamburger.addEventListener("click", function() {
                    hamburger.classList.toggle("active");
                    navMenu.classList.toggle("open");
                });
            }

            const linkTrigger = document.getElementById("link-trigger");
            const subHeader = document.getElementById("sub-header");
            let hideTimeout;

            if (linkTrigger && subHeader) {
                linkTrigger.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                        subHeader.classList.add("visible");
                    }
                });
                
                subHeader.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                    }
                });

                linkTrigger.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });
                
                subHeader.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });

                linkTrigger.addEventListener("click", function(e) {
                    e.preventDefault();
                    if(window.innerWidth <= 768) {
                        subHeader.classList.toggle("visible");
                    }
                });
            }
        });
    </script>
</body>


</html>
