        .lyrics-content {

            max-width: 600px;

        .lyrics-content h3 {

            letter-spacing: 4px;

        .lyrics-content p {
            white-space: pre-line;

    <script>

                header.classList.remove("scrolled");

        });

        </div>
    </div>

    <script>
        const lyricsData = {
            "傷つきたくないふたり": `絡まり合っていた夜の腕に
気後れするような
人ごとの日々は蒸せて

重なり合っていた時の中で

ふたり口づけを夢見るたびに

楽しくてさびしい

ふたりきりの朝を思い描く時

ごまかせずにいる

慌ただしい朝の

このままでいられないと
知っていたはずなのに
