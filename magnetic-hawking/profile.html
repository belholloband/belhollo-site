<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILE | ベルホーロ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #666;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        @media(max-width: 768px) {
            header {
                padding: 30px 24px;
                justify-content: center;
                flex-direction: column;
            }

            header.scrolled {
                padding: 20px 24px;
            }

            nav {
                display: none;
            }
        }

        /* --- Profile Layout --- */
        .profile-container {
            padding: 220px 0 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .profile-image {
            width: 65%;
            max-width: 1000px;
            margin-bottom: 24px;
            display: block;
        }

        .member-names {
            font-size: 11px;
            letter-spacing: 6px;
            color: #555;
            margin-bottom: 100px;
            text-align: center;
            font-weight: 300;
        }

        .band-intro {
            max-width: 640px;
            width: 90%;
            text-align: center;
            font-size: 15px;
            line-height: 2.6;
            color: #333;
            letter-spacing: 2px;
            font-weight: 400;
        }

        .band-intro p {
            margin-bottom: 24px;
        }

        @media(max-width: 768px) {
            .profile-container {
                padding: 160px 0 80px;
            }

            .profile-image {
                width: 90%;
            }

            .member-names {
                font-size: 10px;
                letter-spacing: 4px;
                margin-bottom: 80px;
            }

            .band-intro {
                font-size: 14px;
                line-height: 2.4;
            }
        }
    </style>
</head>

<body>

    <header id="header">
        <div><a href="index.html" style="display: flex; align-items: center; text-decoration: none;"><img src="logo.png" alt="Belhollo" style="height: 28px; width: auto;"></a></div>
        <nav>
            <a href="profile.html">PROFILE</a>
            <a href="news.html">NEWS</a>
            <a href="live.html">LIVE</a>
            <a href="lyrics.html">LYRICS</a>
            <a href="https://belhollo.official.ec/" target="_blank">SHOP</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <div class="profile-container">
        <img src="profile.jpg" alt="Belhollo Profile" class="profile-image">
        
        <div class="member-names">
            (L→R) Akihito Asai(Vo&Gt) , Yu Kato(Gt)
        </div>
        
        <div class="band-intro">
            <p>2017年、夏結成の2人組。2019年より現体制に移行し、東京を拠点に活動中。</p>
            <p>シンプルかつ、浮遊感のあるメロディが特徴。</p>
            <p>2026年8月21日に3枚目のアルバム『ゴーストノート』をリリース。</p>
        </div>
    </div>

    <footer>
        © 2026 Belhollo
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>

</body>

</html>
