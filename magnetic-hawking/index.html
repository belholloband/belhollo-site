<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ベルホーロ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #111;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #444;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        .hero {
            position: relative;
            height: calc(100vh - 108px);
            margin-top: 108px;
            background: #fff url("main-visual.png") center center / contain no-repeat;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 60px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .hero>div {
            position: relative;
            z-index: 10;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.025;
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(40px, 8vw, 100px);
            font-weight: 200;
            letter-spacing: clamp(10px, 2.5vw, 30px);
            margin-bottom: 40px;
            color: #111;
            animation: ambientFade 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            filter: blur(12px);
            padding-left: clamp(10px, 2.5vw, 30px);
            /* Adjust for letter-spacing */
        }

        .hero p {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 10px;
            color: #555;
            text-transform: uppercase;
            animation: ambientFade 4s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
            opacity: 0;
            filter: blur(12px);
            padding-left: 10px;
        }

        section {
            padding: 240px 15%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 140px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.04));
        }

        .section-title {
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 14px;
            margin-bottom: 120px;
            color: #222;
            text-transform: uppercase;
            padding-left: 14px;
        }

        .card {
            margin-bottom: 100px;
            max-width: 600px;
        }

        .card h2 {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 30px;
            color: #111;
        }

        .card p {
            font-size: 13px;
            letter-spacing: 4px;
            color: #111;
            margin-bottom: 16px;
        }

        .card a {
            color: #111;
            text-decoration: none;
            transition: all 0.5s ease;
            opacity: 0.7;
        }

        .card a:hover {
            color: #111;
            opacity: 1;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        .hero-logo {
            font-size: 14px;
            letter-spacing: 4px;
            opacity: 0;
            transform: translateY(20px);
            animation: logoFade 2.5s ease forwards;
            animation-delay: 1s;
        }

        @keyframes logoFade {
            to {
                opacity: 0.8;
                transform: translateY(0);
            }
        }

        @keyframes ambientFade {
            0% {
                opacity: 0;
                filter: blur(16px);
                transform: translateY(20px) scale(0.96);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0) scale(1);
            }
        }

        @media(max-width: 768px) {
            header {
                padding: 30px 24px;
                justify-content: center;
                flex-direction: column;
            }

            header.scrolled {
                padding: 20px 24px;
            }

            nav {
                display: none;
                /* Keep it minimal on mobile to preserve ambient feel */
            }

            section {
                padding: 180px 10%;
            }

            .section-title {
                margin-bottom: 80px;
            }

            .card h2 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <header id="header">
        <div><a href="index.html" style="display: flex; align-items: center; text-decoration: none;"><img src="logo.png" alt="Belhollo" style="height: 28px; width: auto;"></a></div>
        <nav>
            <a href="profile.html">PROFILE</a>
            <a href="news.html">NEWS</a>
            <a href="live.html">LIVE</a>
            <a href="lyrics.html">LYRICS</a>
            <a href="https://belhollo.official.ec/" target="_blank">SHOP</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <div class="hero">
    </div>



    <footer>
        © 2026 Belhollo
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>

</body>

</html>
