<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rd Album「オブスキュア」発売決定のお知らせ | ベルホーロ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #666;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        @media(max-width: 768px) {
            header {
                padding: 30px 24px;
                justify-content: center;
                flex-direction: column;
            }

            header.scrolled {
                padding: 20px 24px;
            }

            nav {
                display: none;
            }
        }

        /* --- News Detail Layout --- */
        .news-detail {
            padding: 220px 12%;
            max-width: 800px;
            margin: 0 auto;
        }

        .news-detail h1 {
            font-size: 22px;
            letter-spacing: 6px;
            margin-bottom: 40px;
        }

        .news-detail .date {
            font-size: 11px;
            color: #222;
            margin-bottom: 8px;
            letter-spacing: 4px;
            /* Added letter spacing to match the overall design */
        }

        .news-detail p {
            line-height: 2.2;
            margin-bottom: 30px;
            color: #333;
        }

        .back-link {
            display: inline-block;
            margin-top: 100px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #444;
            text-decoration: none;
            transition: color 0.4s ease;
            position: relative;
            padding-bottom: 5px;
        }

        .back-link:hover {
            color: #111;
        }

        .back-link::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
            left: 0;
            bottom: 0px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .back-link:hover::after {
            width: 100%;
        }

        @media(max-width:768px) {
            .news-detail {
                padding: 160px 8%;
            }
        }
    </style>
</head>

<body>

    <header id="header">
        <div><a href="index.html" style="display: flex; align-items: center; text-decoration: none;"><img src="logo.png" alt="Belhollo" style="height: 28px; width: auto;"></a></div>
        <nav>
            <a href="profile.html">PROFILE</a>
            <a href="news.html">NEWS</a>
            <a href="live.html">LIVE</a>
            <a href="lyrics.html">LYRICS</a>
            <a href="https://belhollo.official.ec/" target="_blank">SHOP</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <section class="news-detail">
        <div class="date">2026.05.20</div>
        <h1>単独公演「進捗」開催決定</h1>

        <img src="live-flyer.jpg" alt="進捗 Flyer" style="width: 100%; max-width: 600px; margin-bottom: 40px; display: block;">

        <p>
            ベルホーロ単独公演「進捗」を、6月20日に八丁堀七針にて開催いたします。（<a href="live.html" style="color: #333; text-decoration: underline; transition: opacity 0.3s;" onmouseover="this.style.opacity=0.6" onmouseout="this.style.opacity=1">詳細はこちら</a>）
        </p>
        <p>
            本公演では、新旧織り交ぜたセットリストを予定。<br>
            これまでの歩みを辿りながら、現在のベルホーロの姿を体感できるライブとなります。
        </p>
        <p style="margin-bottom: 80px;">
            限定20名での開催となりますので、ぜひお早めに<a href="https://forms.gle/X4WMiF9dZCZBbCoF9" target="_blank" style="color: #333; text-decoration: underline; transition: opacity 0.3s;" onmouseover="this.style.opacity=0.6" onmouseout="this.style.opacity=1">ご予約</a>ください。
        </p>

        <a href="news.html" class="back-link">BACK TO NEWS</a>
    </section>

    <footer>
        © 2026 Belhollo
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>

</body>

</html>
