            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {

        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {

            font-size: 10px;

            color: #111;

        @media(max-width: 768px) {

                flex-wrap: wrap;

                backdrop-filter: blur(20px);

            }

                display: flex !important;

                align-items: flex-end;

            nav.open {

            nav a {

            margin-bottom: 30px;

        }

        .back-link {
            display: inline-block;
            margin-top: 100px;
            font-size: 11px;
            letter-spacing: 4px;
            color: #444;
            text-decoration: none;
            transition: color 0.4s ease;
            position: relative;
            padding-bottom: 5px;
        }

        .back-link:hover {
            color: #111;
        }

        .back-link::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
            left: 0;
            bottom: 0px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .back-link:hover::after {

        }

        @media(max-width:768px) {

            }
        }
    
        .sub-header {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 60px;
            display: flex;
            justify-content: flex-end;
            gap: 40px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(-10px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 99;
        }
        .sub-header.visible {

            visibility: visible;
            transform: translateY(0);
        }
        .sub-header a {
            color: #444;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 4px;
            transition: color 0.3s ease;

        }
        .sub-header a:hover {

        @media(max-width: 768px) {

            .hamburger {

        .hamburger span {

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const hamburger = document.getElementById("hamburger");
            const navMenu = document.getElementById("nav-menu");

            if (hamburger && navMenu) {
                hamburger.addEventListener("click", function() {
                    hamburger.classList.toggle("active");
                    navMenu.classList.toggle("open");
                    if (!hamburger.classList.contains("active") && subHeader) {
                        subHeader.classList.remove("visible");
                    }
                });
            }

            const linkTrigger = document.getElementById("link-trigger");
            const subHeader = document.getElementById("sub-header");
            let hideTimeout;

            if (linkTrigger && subHeader) {
                linkTrigger.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                        subHeader.classList.add("visible");
                    }
                });
                
                subHeader.addEventListener("mouseenter", function(e) {
                    if(window.innerWidth > 768) {
                        clearTimeout(hideTimeout);
                    }
                });

                linkTrigger.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });
                
                subHeader.addEventListener("mouseleave", function(e) {
                    if(window.innerWidth > 768) {
                        hideTimeout = setTimeout(() => { subHeader.classList.remove("visible"); }, 200);
                    }
                });

                linkTrigger.addEventListener("click", function(e) {
                    e.preventDefault();
                    if(window.innerWidth <= 768) {
                        subHeader.classList.toggle("visible");
                    }
                });
            }
        });
    </script>
