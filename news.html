<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS | ベルホーロ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #b4c9ce;
            color: #333;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            overflow-x: hidden;
            line-height: 2.4;
            font-weight: 400;
        }

        ::selection {
            background: rgba(0, 0, 0, 0.1);
            color: #111;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        header div {
            font-weight: 300;
            letter-spacing: 8px;
            font-size: 13px;
            text-transform: uppercase;
            color: #111;
            opacity: 0.9;
        }

        nav a {
            color: #666;
            text-decoration: none;
            margin-left: 60px;
            font-size: 11px;
            letter-spacing: 5px;
            position: relative;
            transition: color 0.5s ease;
        }

        nav a:hover {
            color: #111;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            left: 50%;
            bottom: -10px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 100%;
        }

        footer {
            padding: 180px 0 100px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 8px;
            color: #111;
            text-transform: uppercase;
            padding-left: 8px;
        }

        @media(max-width: 768px) {
            header {
                padding: 30px 24px;
                justify-content: center;
                flex-direction: column;
            }

            header.scrolled {
                padding: 20px 24px;
            }

            nav {
                display: none;
            }
        }

        /* --- News Layout --- */
        .news-list {
            padding: 220px 12%;
            max-width: 900px;
            margin: 0 auto;
        }

        .news-item {
            margin-bottom: 120px;
            border-bottom: 1px solid #222;
            padding-bottom: 60px;
        }

        .news-date {
            font-size: 11px;
            letter-spacing: 4px;
            color: #222;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #333;
            transition: 0.4s ease;
        }

        .news-excerpt {
            font-size: 14px;
            line-height: 2;
            color: #555;
        }

        .news-item a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .news-item:hover .news-title {
            color: #111;
        }

        @media(max-width:768px) {
            .news-list {
                padding: 160px 8%;
            }

            .news-item {
                margin-bottom: 80px;
            }
        }
    </style>
</head>

<body>

    <header id="header">
        <div><a href="index.html" style="display: flex; align-items: center; text-decoration: none;"><img src="logo.png" alt="Belhollo" style="height: 28px; width: auto;"></a></div>
        <nav>
            <a href="profile.html">PROFILE</a>
            <a href="news.html">NEWS</a>
            <a href="live.html">LIVE</a>
            <a href="lyrics.html">LYRICS</a>
            <a href="https://belhollo.official.ec/" target="_blank">SHOP</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <section class="news-list">
        <article class="news-item">
            <a href="news-detail.html">
                <div class="news-date">2026.05.20</div>
                <h2 class="news-title">3rdアルバム『ゴーストノート』リリース決定</h2>
                <div class="news-excerpt">
                    前作『Shallows』から約2年ぶりとなるフルアルバム『ゴーストノート』が8月21日にリリースされることが決定いたしました。
                </div>
            </a>
        </article>

        <article class="news-item">
            <a href="news-detail2.html">
                <div class="news-date">2026.05.20</div>
                <h2 class="news-title">単独公演「進捗」を開催決定</h2>
                <div class="news-excerpt">
                    約1年ぶりとなる企画ライブを八丁堀七針にて開催することが決定いたしました。
                </div>
            </a>
        </article>
    </section>

    <footer>
        © 2026 Belhollo
    </footer>

    <script>
        window.addEventListener("scroll", function () {
            const header = document.getElementById("header");
            if (window.scrollY > 50) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>

</body>

</html>
